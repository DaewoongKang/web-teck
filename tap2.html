<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tab example 2</title>
    <style>
        .tab {
            overflow: hidden;
            border: 1px solid #ccc;
            background-color: #f1f1f1;
        }
        .tab button {
            background-color: inherit;
            float: left;
            border: none;
            outline: none;
            cursor: pointer;
            padding: 14px 16px;
            transition: 0.3s;
        }
        .tab button:hover {
            background-color: #ddd;
        }
        .tabcontent {
            display: none;
            padding: 6px 12px;
            border: 1px solid #ccc;
            border-top: none;
        }
    </style>

    <style>
        body[tab="tab1"] div.tab1,
        body[tab="tab2"] div.tab2,
        body[tab="tab3"] div.tab3 {
            display: block;
        }

        body[tab="tab1"] button.tab1,
        body[tab="tab2"] button.tab2,
        body[tab="tab3"] button.tab3 {
            background-color: #ccc;;
        }
    </style>
    <script>
        onload = () => {
            const tab = document.querySelector('.tab');//event bubbling
            tab.addEventListener('click', function(event) {
                const tabName = event.target.className;
                document.body.setAttribute('tab', tabName);
            });
        }
    </script>
</head>
<body>
    <h1>Tab Example</h1>
    <div class="tab">
        <button class="tab1">Tab 1</button>
        <button class="tab2">Tab 2</button>
        <button class="tab3">Tab 3</button>
    </div>
    <div class="tab1 tabcontent">
        <h3>Tab 1</h3>
        <p>Content 1</p>
    </div>
    <div class="tab2 tabcontent">
        <h3>Tab 2</h3>
        <p>Content 2</p>
    </div>
    <div class="tab3 tabcontent">
        <h3>Tab 1</h3>
        <p>Content 1</p>
    </div>
</body>
</html>
